# routes_meta.yaml — human-authored routing copy (the only human input to the generator).
# A hub's name/description becomes the host-visible frontmatter; rules/jump go into the
# body; sections partition the scientific hub.
hubs:
  research:
    description: >
      Research methodology hub: experimental design, statistical tests and inference,
      sample-size / power analysis, hypothesis generation and testing, critical evaluation
      of scientific claims, peer review, academic writing (IMRAD), research brainstorming,
      grant proposals (NSF/NIH/DARPA/NSTC), market research reports, HTR iterative
      optimization, classical text analysis.
      TRIGGER = design an experiment / pick a statistical test / compute sample size /
      generate or test a hypothesis / review a paper / write a paper or grant / evaluate
      evidence quality.
      SKIP = running concrete bio-computation, database or API lookups (-> scientific),
      finding papers and citation formatting (-> references), publication-grade figures
      (-> docs-figures), generic ML libraries (-> data-ml), UI/infrastructure engineering
      (-> dev).
    rules:
      - "Goal = reach a CONCLUSION / design an experiment / statistical decision / academic text -> this hub"
      - "Goal = run a concrete algorithm or fetch a database record -> scientific"
      - "Paper retrieval, citation formatting, patents / regulatory text -> references"
      - "Publication-grade figure, slide, or poster output -> docs-figures"
    jump:
      - "Choosing a statistical method -> this hub; RUNNING the stats code on data -> data-ml (statsmodels/scikit-learn/pymc)"
      - "Citing literature -> references; CRITIQUING its claims -> this hub (scientific-critical-thinking)"
  scientific:
    description: >
      Biology / chemistry / medicine computation hub: structure prediction and sequence
      design (AlphaFold2/Boltz/Chai-1/ESMFold2/ESMFold/OpenFold3/PyMOL/MD), sequence and
      genomics tooling (Biopython/Clustal Omega/IQ-TREE/ETE), 30+ database queries
      (UniProt/Ensembl/PDB/PubChem/ChEMBL/gnomAD/clinVar/DepMap/1000Genomes/STRING/
      Reactome/KEGG-JASPAR/QuickGO ...), single-cell and transcriptomics (Scanpy/anndata/
      scvi-tools/cellxgene-census/scVelo/bulk RNA-seq/DESeq2/DEEPTools/GRN/pathway
      enrichment/geniml/gtars/pysam/TileDB-VCF), clinical (CDS/clinical reporting/
      indication dossier/ISO13485/treatment plans/PyHealth/imaging BIDS/pathology WSI/
      electrophysiology), cheminformatics and drug discovery (RDKit/datamol/medchem/
      molfeat/DeepChem/TorchDrug/PyOpenMS/COBRApy/DiffDock/pymatgen), lab & cloud
      platform integration (Benchling/LabArchive/DNAnexus/LatchBio/Ginkgo/Opentrons/
      pylabrobot/protocols.io/Nextflow/pacsomatic), quantum & general simulation
      (Qiskit/cirq/PennyLane/QuTiP/SimPy/PyMC/Astropy/FluidSim/MATLAB).
      TRIGGER = protein folding / UniProt-PDB-ChEMBL-gnomAD lookups / run Scanpy or
      RNA-seq / dock molecules / write Opentrons protocols / query a gene variant / MD
      simulation / structural similarity search / single-cell analysis / drug molecules.
      SKIP = statistical methodology and hypothesis design (-> research), literature and
      citation (-> references), generic ML frameworks (transformers/polars/
      pytorch-lightning -> data-ml), publication figures and slides (-> docs-figures),
      UI engineering and GPU clouds (-> dev).
    rules:
      - "Goal = RUN a concrete bio-computation / query a concrete database / predict structure / design a molecule -> this hub"
      - "Goal = methodology (experimental design, statistical inference, hypothesis) -> research"
      - "Paper retrieval / citations / patents / regulatory text -> references"
      - "Pure generic data & ML libraries (no domain flavor) -> data-ml"
      - "Publication-grade figure / slide / poster -> docs-figures"
    jump:
      - "Charts & figures -> docs-figures (do not hard-draw matplotlib inside this hub)"
      - "Statistical methodology -> research; the stats libraries themselves -> data-ml"
      - "Writing grants / reports -> research"
    sections:
      A Structure prediction & sequence design:
        - alphafold2
        - alphafold-database-fetch-and-analyze
