  references:
    description: >
      文献/引文/格式/法规簇（references hub）：文献检索（arXiv / bioRxiv / Europe PMC /
      OpenAlex / PubMed / Semantic Scholar / CORE / Unpaywall / Crossref）、文献综述、
      引文管理与 BibTeX、文献格式（Nature/Cell/CONSORT/STROBE/PRISMA）、Zotero 集成、
      专利与法规文本（US Fiscal Data / openFDA / 数据库可查性）、文档转换（MarkItDown /
      liteparse 提取）、并行网络搜索（Exa / parallel-cli / research-lookup）。
      触发 = 找文献/查 DOI/引 BibTeX/文献综述/检查引用/专利/法规/提取 PDF 文本/批量获取数据集。
      非触发 = 文献观点综合与批判（→research）、出发表级图（→docs-figures）、生物计算（→scientific）。
    rules:
      - "涉及文献获取、引文格式、专利/法规文本 → 本簇"
      - "对文献做观点综合/批判 → research"
      - "查结构化数据库（非文献）→ scientific"
    jump:
      - "文献内容批判 → research（scientific-critical-thinking）"
      - "要写综述/论文 → research（scientific-writing）"
  dev:
    description: >
      工程/UI/云/GPU 簇（dev hub）：前端设计（frontend-design）、UI/UX 风格库
      （ui-ux-pro-max，84 种风格/192 配色/74 字号/192 产品类型/98 条 UX 指南/104 图标/GSAP 动画/
      25 种图表 × 22 栈）、Web 界面规范审查（web-design-guidelines）、Modal 无服务器
      云（GPU/批量/端点）、NVIDIA/CUDA 加速（optimize-for-gpu：CuPy/Numba/CuDF/cuML/cuGraph/Warp）、
      Pi 极简 agent harness（pi-agent：安装/配置/skills/extensions/MCP/RPC）。
      触发 = 写前端/做 UI/审查界面/部署 GPU/跑批量云加速/NVIDIA 优化/装 Pi harness。
      非触发 = 生物领域计算（→scientific）、发表级图（→docs-figures）、统计/ML 方法论（→research）。
    rules:
      - "写代码 / 做 UI / 部署云 / GPU 加速 → 本簇"
      - "领域计算（生物/化学）→ scientific"
      - "通用数据与 ML 库 → data-ml"
    jump:
      - "出 UI 设计系统 → 本簇（ui-ux-pro-max）；出发表级图 → docs-figures"
  data-ml:
    description: >
      通用数据/ML/科学计算簇（data-ml hub）：大内存 DataFrame（polars/dask/vaex/zarr-python/
      lamindb）、科学数据文件格式探查（exploratory-data-analysis）、时序与预测
      （aeon/timesfm-forecasting）、统计与贝叶斯（statsmodels/statistical-analysis/
      scikit-learn/scikit-survival/shap/pymc/pymoo）、深度学习（transformers/
      pytorch-lightning/torch-geometric/stable-baselines3）、图与空间（networkx/
      geopandas/geomaster）、降维（umap-learn）、资源自检（get-available-resources）。
      触发 = ETL/polars/dask/ML 模型/时序预测/图算法/地理空间/大内存/跑通用科学计算。
      非触发 = 生物领域计算（→scientific）、出发表级图（→docs-figures）、设计实验（→research）。
    rules:
      - "通用数据与 ML 算法（无生物领域色彩）→ 本簇"
      - "生物/化学/临床计算 → scientific"
      - "出发表级图 → docs-figures"
    jump:
      - "生物领域（单细胞/蛋白/基因组）→ scientific"
      - "要发表级图 → docs-figures"
  docs-figures:
    description: >
      发表级交付物样式簇（docs-figures hub）：发表级图（figure-style/scientific-visualization/
      scientific-schematics）、快速探索图（seaborn/matplotlib）、幻灯片/演示
      （scientific-slides/pptx-posters/latex-posters）、infographic（infographics）、
      Mermaid 工作流图（markdown-mermaid-writing/archify）、科学示意图
      （scientific-schematics）、AI 生图（generate-image，顶层直用不走本簇）。
      触发 = 出发表级图/画幻灯片/做海报/生成 infographic/Mermaid 流程图/科学示意图。
      非触发 = 快速 EDA 图（直接用 seaborn/matplotlib）、UI 设计（→dev）、写论文正文（→research）。
    rules:
      - "目标是产出交付物样式的图/幻灯片/海报/示意图 → 本簇"
      - "快速探索性图表 → 直接用 seaborn/matplotlib（仍在 docs-figures 簇内可查）"
      - "写论文正文 → research"
    jump:
      - "要 EDA 快图 → 直接用 seaborn/matplotlib，不必加载发表级 checklist"
  team:
    description: >
      角色路由簇（team hub）：从 agency-agents 精选的 ~40 个角色人格
      （SRE、Software Architect、Code Reviewer、Codebase Onboarding、DevOps Automator、
      Technical Writer、Business/PM/Strategy/Marketing/Finance 等）+ 路由判据 +
      "如何请角色"（轻用：当前会话内按 persona 执行；重用：subagent 委托）。
      触发 = "让 SRE/Architect 审"、"按 Product Manager 视角"、"委派给 Code Reviewer"、
      "用这个角色的清单"、"角色列表"。
      非触发 = 技能调用（→对应领域 hub）、工具执行（→具体技能）。
    rules:
      - "目标是请某个专家角色做事 → 本簇"
      - "目标是让某个专家执行 → 本簇"
    jump:
      - "角色 persona 在 roles/*.md；执行走 subagent 或当前会话内按 persona"
