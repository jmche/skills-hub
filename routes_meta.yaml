  references:
    description: >
      Literature / citation / formatting / regulatory hub: paper search (arXiv / bioRxiv /
      Europe PMC / OpenAlex / PubMed / Semantic Scholar / CORE / Unpaywall / Crossref),
      literature review, citation management and BibTeX, manuscript formatting (Nature/
      Cell/CONSORT/STROBE/PRISMA), Zotero integration, patents and regulatory text
      (US fiscal data / openFDA / database availability), document extraction (MarkItDown /
      liteparse), parallel web search (Exa / parallel-cli / research-lookup).
      TRIGGER = find papers / look up a DOI / format BibTeX / literature review /
      check a citation / patents / regulations / extract PDF text / bulk fetch datasets.
      SKIP = synthesizing or critiquing paper claims (-> research), publication-grade
      figures (-> docs-figures), bio-computation (-> scientific).
    rules:
      - "Paper retrieval, citation formatting, patents / regulatory text -> this hub"
      - "Synthesizing or critiquing claims INSIDE papers -> research"
      - "Querying structured databases (non-literature) -> scientific"
    jump:
      - "Critiquing literature's claims -> research (scientific-critical-thinking)"
      - "Writing a review or manuscript -> research (scientific-writing)"
  dev:
    description: >
      Engineering / UI / cloud / GPU hub: frontend design (frontend-design), UI/UX style
      library (ui-ux-pro-max: 84 styles / 192 palettes / 74 type scales / 192 product
      types / 98 UX guidelines / 104 icons / GSAP motion / 25 chart types x 22 stacks),
      web UI standard review (web-design-guidelines), Modal serverless clouds
      (GPU/batch/endpoints), NVIDIA/CUDA acceleration (optimize-for-gpu: CuPy/Numba/CuDF/
      cuML/cuGraph/Warp), Pi minimal agent harness (pi-agent: install/configure/skills/
      extensions/MCP/RPC).
      TRIGGER = build frontend / design UI / review an interface / deploy GPU / run
      batch cloud acceleration / NVIDIA optimization / install the Pi harness.
      SKIP = domain bio/chem computation (-> scientific), publication figures
      (-> docs-figures), statistical & ML methodology (-> research).
    rules:
      - "Build web UI / frontend / deploy to cloud / GPU acceleration -> this hub"
      - "Domain (bio/chem) computation -> scientific"
      - "Generic data & ML libraries -> data-ml"
    jump:
      - "UI design system -> this hub (ui-ux-pro-max); publication-grade figures -> docs-figures"
  data-ml:
    description: >
      Generic data / ML / scientific-compute hub: large-memory DataFrames (polars/dask/
      vaex/zarr-python/lamindb), scientific data format exploration (exploratory-data-
      analysis), time series & forecasting (aeon/timesfm), statistics & Bayesian
      (statsmodels/statistical-analysis/scikit-learn/scikit-survival/shap/pymc/pymoo),
      deep learning (transformers/pytorch-lightning/torch-geometric/stable-baselines3),
      graph & geography (networkx/geopandas/geomaster), dimensionality reduction
      (umap-learn), resource self-check (get-available-resources).
      TRIGGER = ETL / polars / dask / train an ML model / time-series forecasting /
      graph algorithms / geospatial / big-memory / run generic scientific compute.
      SKIP = domain bio/chem computation (-> scientific), publication figures
      (-> docs-figures), experimental design (-> research).
    rules:
      - "Generic data & ML libraries (no domain flavor) -> this hub"
      - "Bio / chem / clinical computation -> scientific"
      - "Publication figures -> docs-figures"
    jump:
      - "Domain (single-cell / protein / genomics) work -> scientific"
      - "Publication-grade output -> docs-figures"
  docs-figures:
    description: >
      Publication-grade visual deliverables hub: publication figures (figure-style /
      scientific-visualization / scientific-schematics), quick exploratory plots
      (seaborn/matplotlib), slide decks & presentations (scientific-slides /
      pptx-posters / latex-posters), infographics (infographics), Mermaid workflow
      diagrams (markdown-mermaid-writing / archify), scientific schematics
      (scientific-schematics), AI image generation (generate-image, top-level, NOT routed
      through this hub).
      TRIGGER = produce a publication figure / build slides / make a poster / generate an
      infographic / draw a Mermaid flow / technical schematic.
      SKIP = quick exploratory plots (use seaborn/matplotlib directly), UI design
      (-> dev), writing the paper body (-> research).
    rules:
      - "Goal = deliverable-style figure / slides / poster / schematic -> this hub"
      - "Exploratory charting -> plain seaborn/matplotlib (still inside this hub, but no checklist needed)"
      - "Writing the paper body -> research"
    jump:
      - "Quick exploratory plot -> plain seaborn/matplotlib, skip the checklist"
  team:
    description: >
      Role-routing hub: ~33 curated expert personas (SRE, Software Architect, Code
      Reviewer, Codebase Onboarding, DevOps Automator, Technical Writer, Product Manager,
      Security, QA, PM) + routing rules + "how to invoke a role" (light: in-session
      persona execution; heavy: subagent delegation).
      TRIGGER = "have the SRE check this" / "from the Product Manager's view" /
      "delegate to the Code Reviewer" / "walk this role's checklist" / "role list".
      SKIP = invoking a specific technical skill (-> the domain hub) or running a
      concrete tool (-> that skill).
    rules:
      - "Goal = get an EXPERT ROLE to do the work -> this hub"
      - "Goal = have a specialist execute a task -> this hub"
    jump:
      - "Roles live in roles/*.md; run them in-session or via subagent."
