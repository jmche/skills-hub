# routes_meta.yaml — 人工维护的路由文案（生成器的唯一人工输入）
# hub 的 name/description 直接成为宿主可见的 frontmatter；rules/jump 写进正文；sections 分组科学簇。
hubs:
  research:
    description: >
      科研方法论簇（research hub）：实验设计、统计检验与推断、样本量/功效分析、假说生成与
      检验、科学批判性评估、同行评审、学术写作（IMRAD）、科研头脑风暴、基金标书（NSF/NIH/DARPA/
      NSTC）、市场研究报告、HTR 迭代优化、古代文本分析。
      触发 = 设计实验/选统计检验/样本量/提出假说/审论文/写论文或标书/科研思路/评估证据质量。
      非触发 = 跑具体生物计算与查数据库（→scientific）、找文献与引文格式（→references）、
      出发表级图（→docs-figures）、通用 ML 库（→data-ml）、UI/部署工程（→dev）。
    rules:
      - "目标 = 得出结论 / 设计实验 / 统计决策 / 写学术文本 → 本簇"
      - "目标是跑具体算法、查一条数据库记录 → scientific"
      - "涉及文献获取、引文、专利/法规文本 → references"
      - "需要发表级图片/幻灯片/海报 → docs-figures"
    jump:
      - "选统计方法 → 本簇；在该数据上跑统计代码 → data-ml（statsmodels/scikit-learn/pymc）"
      - "引用文献 → references；批判文献观点 → 本簇（scientific-critical-thinking）"
  scientific:
    description: >
      生物/化学/医学计算簇（scientific hub）：结构预测与序列设计（AlphaFold2/Boltz/Chai-1/
      ESMFold2/ESMFold/OpenFold3/Pymol/MD）、序列与基因组工具（Biopython/Clustal Omega/
      IQ-TREE/ETE）、30+ 数据库查询（UniProt/Ensembl/PDB/PubChem/ChEMBL/gnomAD/clinVar/
      DepMap/1000Genomes/STRING/Reactome/KEGG-JASPAR/QuickGO…）、单细胞与转录组（Scanpy/
      anndata/scvi-tools/cellxgene-census/scVelo/bulk RNA-seq/DESeq2/DEEPTools/GRN/
      通路富集/geniml/gtars/pysam/TileDB-VCF）、临床医学（CDS/临床报告/适应症综述/
      ISO13485/治疗方案/PyHealth/影像 BIDS/病理 WSI/神经电生理）、化学与药物发现
      （RDKit/datamol/medchem/molfeat/DeepChem/TorchDrug/PyOpenMS/COBRA/DiffDock/
      材料 pymatgen）、实验室与云平台集成（Benchling/LabArchive/DNAnexus/LatchBio/
      Ginkgo/Opentrons/pylabrobot/protocols.io/Nextflow/pacsomatic）、量子与通用模拟
      （Qiskit/cirq/PennyLane/QuTiP/SimPy/PyMC/Astropy/FluidSim/MATLAB）。
      触发 = 蛋白质折叠/查 UniProt PDB ChEMBL/跑 Scanpy/跑 RNA-seq/Dock 分子/写 Opentrons 协议/
      查基因变异/跑分子动力学/查结构相似性/GRN/单细胞/药物分子。
      非触发 = 统计方法论与假说设计（→research）、找文献与引文（→references）、
      通用 ML 框架（transformers/polars/pytorch-lightning →data-ml）、
      发表级图与幻灯片（→docs-figures）、UI 工程与 GPU 云（→dev）。
    rules:
      - "目标 = 跑具体生物计算 / 查具体数据库 / 结构预测 / 分子设计 → 本簇"
      - "目标是方法论层面（实验设计、统计推断、假说）→ research"
      - "文献查找/引文/专利/法规文本 → references"
      - "纯通用数据与 ML 库（无生物领域色彩）→ data-ml"
      - "发表级出图/幻灯片/海报 → docs-figures"
    jump:
      - "出图 → docs-figures（别在簇内硬画 matplotlib）"
      - "统计方法论 → research；统计库本身 → data-ml"
      - "写标书/报告 → research"
