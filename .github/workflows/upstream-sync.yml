name: Upstream sync

# 每天同步 upstreams.json 里登记的上游技能；check.py 和密钥扫描都通过后才推送到 main
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 不把 token 留在 .git/config 里：同步时会运行上游的探测代码，token 只在推送步骤里提供
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (check.py dependency)
        run: pip install pyyaml
      - name: Configure the commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: List stale upstreams
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u _scripts/check_upstreams.py --stale > "$RUNNER_TEMP/stale.txt" \
            || touch "$RUNNER_TEMP/lookup_failed"
      # 这一步会运行上游的探测代码，所以整个进程树里都没有 token
      - name: Sync stale upstreams (each sync runs check.py before it commits)
        run: |
          stale="$RUNNER_TEMP/stale.txt"
          failed=0
          [ -e "$RUNNER_TEMP/lookup_failed" ] && failed=1
          while read -r -u 3 name ref; do
            if ! python3 -u _scripts/sync_upstream.py "$name" --ref "$ref" --commit; then
              echo "::error::sync of $name failed; the other upstreams are still pushed"
              failed=1
              # 丢弃这一个上游在 runner 上留下的未提交改动（包括被上游 .gitignore 忽略的文件），后面的上游从干净的工作区开始
              git reset -q --hard HEAD
              git clean -qffdx
            fi
          done 3< "$stale"
          exit "$failed"
      - name: No secrets in tracked files
        id: scan
        if: ${{ !cancelled() }}
        run: bash _scripts/scan_secrets.sh
      - name: Push the sync commits
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # git 通过 askpass 从环境变量读取 token，token 不出现在命令行参数和 .git/config 里
          askpass="$RUNNER_TEMP/askpass.sh"
          printf '#!/bin/sh\nprintf "%%s" "$GH_TOKEN"\n' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push "https://x-access-token@github.com/$REPO.git" HEAD:main
          rm -f "$askpass"
