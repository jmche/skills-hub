name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyYAML (check.py dependency)
        run: pip install pyyaml
      - name: Run consistency gates (check.py)
        run: python3 _scripts/check.py
      - name: install.sh syntax check
        run: bash -n install.sh
      - name: No secrets in tracked files
        run: bash _scripts/scan_secrets.sh
