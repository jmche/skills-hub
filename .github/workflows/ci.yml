name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (check.py dependency)
        run: pip install pyyaml
      - name: Run consistency gates (check.py)
        run: python3 _scripts/check.py
      - name: install.sh syntax check
        run: bash -n install.sh
      - name: No secrets in tracked files
        run: |
          hits=$(git ls-files -z | xargs -0 grep -IHoE \
            'sk-[A-Za-z0-9]{30,}|ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}' \
            2>/dev/null | grep -v 'sk-abcdefghijklmnopqrstuvwxyz' | cut -d: -f1 | sort -u)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
